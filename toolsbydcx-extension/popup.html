<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToolsByDcx Flow</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="brand">
      <div class="brand-left">
        <div class="logo-circle">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="brand-copy">
          <div class="brand-title"><h1>ToolsByDcx Flow</h1></div>
        </div>
      </div>
      <span class="version-badge" id="version-badge">v1.0</span>
    </header>

    <section class="card user-card">
      <div class="avatar" id="user-avatar">?</div>
      <div class="user-details">
        <div class="user-username" id="customer-name">Checking status…</div>
        <div class="user-plan" id="customer-plan" hidden></div>
        <div class="user-days"><span id="subscription-days">Checking plan…</span></div>
      </div>
    </section>

    <div id="status" role="status" aria-live="polite">Checking your plan…</div>
    <button id="start" class="main-action-btn" type="button" disabled>Open Flow</button>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
  <script src="browser-guard.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
